# TG Lab — gateway segmentation ruleset (nft list ruleset)
table inet seg {
  chain forward {
    type filter hook forward priority 0; policy drop;
    ip saddr 10.10.10.0/24 ip daddr 10.10.30.12 tcp dport 443  accept  # user  -> app  (HTTPS only)
    ip saddr 10.10.20.0/24 ip daddr 10.10.30.12 tcp dport 8080 accept  # dmz   -> app
    ip saddr 10.10.30.0/24 ip daddr 10.10.40.0/24 tcp dport 514 accept # server-> core (syslog)
    ip saddr 10.10.50.10   ip daddr 10.10.40.0/24 tcp dport { 22, 3389 } accept  # jump host only
    log prefix "SEG-DROP " drop
  }
}
