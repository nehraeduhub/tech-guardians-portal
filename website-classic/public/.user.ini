; PHP settings read by Hostinger's PHP (PHP-FPM / LiteSpeed). Only settings PHP allows per folder.
display_errors = Off
display_startup_errors = Off
log_errors = On
html_errors = Off
session.use_strict_mode = 1
session.use_only_cookies = 1
